# Тег vX.Y.Z → сборка APK и релиз на GitHub. Приложение берёт обновления из последнего релиза.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Сборка и офлайн-тесты
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Описание релиза из сообщения тега
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          cp app/build/outputs/apk/release/app-release.apk "LibKat-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: LibKat-*.apk
          body_path: notes.md
