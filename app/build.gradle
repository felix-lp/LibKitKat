plugins {
    id 'com.android.application'
}

// Единственное место с версией: при пуше с новой версией GitHub Actions сам выпустит релиз vX.Y.Z
def appVersion = '0.5.1'
def versionParts = appVersion.tokenize('.')*.toInteger()

android {
    namespace 'io.github.felixlp.libkat'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.felixlp.libkat'
        minSdk 19
        // Приложение рассчитано на KitKat; высокий targetSdk ничего не даёт, а 28 не требует runtime-разрешений
        targetSdk 28
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName appVersion
        // Откуда приложение берёт обновления (GitHub Releases)
        buildConfigField 'String', 'UPDATE_REPO', '"felix-lp/LibKitKat"'

        ndk {
            // Tab 3 — armeabi-v7a, x86 оставлен для эмуляторов
            abiFilters 'armeabi-v7a', 'x86'
        }
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
    }

    signingConfigs {
        // Общий ключ в репозитории: обновления ставятся поверх независимо от того, где собран APK
        shared {
            storeFile file('libkat.keystore')
            storePassword 'libkat'
            keyAlias 'libkat'
            keyPassword 'libkat'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError true
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'GradleDependency', 'NewerVersionAvailable'
    }

    testOptions {
        unitTests.all {
            systemProperty 'live', System.getProperty('live', 'false')
            environment 'LIB_LOGIN', System.getenv('LIB_LOGIN') ?: ''
            environment 'LIB_PASSWORD', System.getenv('LIB_PASSWORD') ?: ''
            testLogging {
                events 'passed', 'skipped', 'failed', 'standardOut'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    // 3.12.x — последняя ветка OkHttp с поддержкой Android 4.4
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Современный TLS (1.2/1.3) и шифры, которых нет в системе 4.4
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
